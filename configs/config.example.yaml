# Sky-Server 配置文件示例
# 使用时请复制为 config.yaml 并修改相应配置

# 应用配置
app:
  name: "Sky-Server"
  version: "1.0.2"
  env: "development"  # development, production
  port: 9090
  # host: "127.0.0.1"  # 监听地址：生产只允许本机 nginx 转发时填 127.0.0.1；不填为所有地址
  mode: "debug"  # debug, release

# 数据库配置
database:
  mysql:
    host: "localhost"
    port: 3306
    username: "root"
    password: "abc123"
    database: "skyserver"
    charset: "utf8mb4"
    parseTime: true
    loc: "Local"
    maxIdleConns: 10
    maxOpenConns: 100
    connMaxLifetime: 3600  # 秒
    logLevel: "info"  # SQL日志级别: silent(不打印), error(仅错误), warn(警告+错误), info(所有SQL)

# Redis配置
redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  poolSize: 10
  minIdleConns: 5

# JWT配置
jwt:
  secret: "your-secret-key-change-in-production"
  accessTokenExpire: 7200    # 2小时（秒）
  refreshTokenExpire: 604800 # 7天（秒）

# 日志配置
log:
  level: "info"  # debug, info, warn, error
  format: "json"  # json, text
  output: "stdout"  # stdout, file
  filePath: "logs/app.log"
  maxSize: 100  # MB
  maxBackups: 10
  maxAge: 30  # 天
  compress: true

# CORS配置
cors:
  allowOrigins:
    - "http://localhost:3000"
    - "http://localhost:8080"
  allowMethods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allowHeaders:
    - "Content-Type"
    - "Authorization"
    - "X-Share-Token" # 加密分享访问凭证
  exposeHeaders:
    - "Content-Length"
  allowCredentials: true
  maxAge: 3600

# 缓存配置
cache:
  # 元数据缓存过期时间（秒）
  metadataTTL: 86400  # 24小时
  # 字典缓存过期时间（秒）
  dictTTL: 3600  # 1小时
  # 权限缓存过期时间（秒）
  permissionTTL: 1800  # 30分钟
  languageTTL: 86400  # 24小时

# 限流配置
rateLimit:
  enabled: true
  requestsPerMinute: 100  # 每分钟请求数
  burstSize: 20

# 文件上传配置
upload:
  maxSize: 10485760  # 10MB（字节）
  allowedTypes:
    - "image/jpeg"
    - "image/png"
    - "image/gif"
    - "application/pdf"
    - "application/msword"
    - "application/vnd.ms-excel"
  uploadPath: "uploads"

# 文件管理配置（云盘）
file:
  uploadDir: "uploads"  # 上传目录
  maxFileSize: 21474836480  # 最大文件大小：20GB（字节）
  allowedExts:  # 允许的文件扩展名（空列表表示允许所有类型）
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".gif"
    - ".pdf"
    - ".doc"
    - ".docx"
    - ".xls"
    - ".xlsx"
    - ".ppt"
    - ".pptx"
    - ".txt"
    - ".zip"
    - ".rar"
    - ".7z"
    - ".mp4"
    - ".avi"
    - ".mkv"
    - ".mp3"
    - ".wav"

# Swagger配置
swagger:
  enabled: true
  title: "Sky-Server API"
  description: "元数据驱动的企业级应用框架"
  version: "1.0.2"
  host: "localhost:9090"
  basePath: "/api/v1"

# 安全配置
security:
  # 密码加密cost（bcrypt）
  passwordCost: 10
  # 敏感字段（云密钥等）AES 加密密钥；上线后不要更换，否则已加密数据无法解密
  fieldEncryptKey: "${FIELD_ENCRYPT_KEY}"
  # 允许执行Bash命令的白名单
  allowedBashCommands:
    - "echo"
    - "date"
    - "pwd"
  # Bash执行超时（秒）
  bashTimeout: 30

# 监控配置
monitoring:
  # 是否启用慢查询日志
  slowQueryEnabled: true
  # 慢查询阈值（毫秒）
  slowQueryThreshold: 500

# 存储配置
storage:
  # 默认存储类型: local, aliyunOSS, tencentCOS
  default: "local"
  
  # 本地存储配置
  local:
    basePath: "uploads"
    baseURL: "http://localhost:9090/files"
  
  # 阿里云OSS配置
  aliyunOSS:
    endpoint: "oss-cn-hangzhou.aliyuncs.com"
    accessKeyID: "your-access-key-id"
    accessKeySecret: "your-access-key-secret"
    bucketName: "your-bucket-name"
    cdnDomain: ""
  
  # 腾讯云COS配置
  tencentCOS:
    bucketURL: "https://your-bucket-name.cos.ap-guangzhou.myqcloud.com"
    secretID: "your-secret-id"
    secretKey: "your-secret-key"
    bucketName: "your-bucket-name"
    region: "ap-guangzhou"
    cdnDomain: ""

# 动作执行配置
action:
  scriptTimeout: 30  # 脚本执行超时时间（秒）

# 分片上传配置
multipartUpload:
  chunkSize: 52428800  # 分片大小（字节），默认 50MB
  sessionExpireHours: 24  # 上传会话过期时间（小时）
  cleanupInterval: 3600  # 过期会话清理间隔（秒），默认 1 小时

# 云盘配置
cloud:
    # 是否启用云盘功能
    enabled: true
    # 用户认证策略: sso, standalone, both
    authStrategy: "both"
    # 默认存储类型: local, aliyunOSS, tencentCOS
    defaultStorage: "tencentCOS"
    # 存储配置（各公司默认值）
    storage:
      local:
        basePath: "uploads"
        baseURL: "http://localhost:9090/files"

# 腾讯云配置
tencentCloud:
  # 腾讯云 SecretID
  secretID: "your-tencent-secret-id"
  # 腾讯云 SecretKey
  secretKey: "your-tencent-secret-key"
  # 区域，如 ap-guangzhou, ap-shanghai, ap-beijing
  region: "ap-guangzhou"
  # 回调密钥，用于验证腾讯云回调签名（可选，留空则不验证签名）
  callbackKey: ""

  # 直播配置
  live:
    # 是否启用直播功能
    enabled: false
    # 推流域名
    pushDomain: "push.yourdomain.com"
    # 播放域名
    playDomain: "play.yourdomain.com"
    # 应用名称
    appName: "live"
    # 推流密钥
    streamKey: "your-stream-key"
    # 录制文件存储桶
    recordBucket: "your-record-bucket"
    # 录制文件存储区域
    recordRegion: "ap-guangzhou"
    # 回调URL（配置在腾讯云控制台）
    callbackURL: "https://your-domain.com/api/v1/live/callback"

    cdnDomain: ""

# 过期数据定时清理：过期会话、超过保留期的审计日志、已过期分享状态
housekeeping:
  intervalSeconds: 3600
  # 审计日志保留天数，0 表示不删除
  auditRetentionDays: 180

# 直播计费（一期只计量不扣费：直播时长、播放流量、存储空间）
billing:
  meterDisabled: false       # true 关闭计量定时任务
  meterIntervalSeconds: 300  # 推流段落整理与在线巡检间隔
  dailyHour: 4               # 每天几点计算前一天的流量和存储（腾讯云次日 3 点出数据）
  minSessionSeconds: 60      # 单段推流不足该秒数不计时长

# 火山引擎（字幕同传）：全局统一配置，所有公司共用平台账号
volcengine:
  accessKeyId: ""
  accessKeySecret: ""
  region: "cn-north-1"
  service: "live"
  # 火山方舟大模型（字幕同传词库智能提取），固定使用北京区域
  ark:
    apiKey: ""
    model: ""   # 推理接入点 ID（ep-…）
