# Sky-Server 配置文件示例
# 使用时请复制为 config.yaml 并修改相应配置

# 应用配置
app:
  name: "Sky-Server"
  version: "1.0.0"
  env: "development"  # development, production
  port: 9090
  mode: "debug"  # debug, release

# 数据库配置
database:
  mysql:
    host: "localhost"
    port: 3306
    username: "root"
    password: "abc123"
    database: "skyserver"
    charset: "utf8mb4"
    parseTime: true
    loc: "Local"
    maxIdleConns: 10
    maxOpenConns: 100
    connMaxLifetime: 3600  # 秒
    logLevel: "info"  # SQL日志级别: silent(不打印), error(仅错误), warn(警告+错误), info(所有SQL)

# Redis配置
redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  poolSize: 10
  minIdleConns: 5

# JWT配置
jwt:
  secret: "your-secret-key-change-in-production"
  accessTokenExpire: 7200    # 2小时（秒）
  refreshTokenExpire: 604800 # 7天（秒）

# 日志配置
log:
  level: "info"  # debug, info, warn, error
  format: "json"  # json, text
  output: "stdout"  # stdout, file
  filePath: "logs/app.log"
  maxSize: 100  # MB
  maxBackups: 10
  maxAge: 30  # 天
  compress: true

# CORS配置
cors:
  allowOrigins:
    - "http://localhost:3000"
    - "http://localhost:8080"
    - "*"
  allowMethods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allowHeaders:
    - "Content-Type"
    - "Authorization"
  exposeHeaders:
    - "Content-Length"
  allowCredentials: true
  maxAge: 3600

# 缓存配置
cache:
  # 元数据缓存过期时间（秒）
  metadataTTL: 86400  # 24小时
  # 字典缓存过期时间（秒）
  dictTTL: 3600  # 1小时
  # 权限缓存过期时间（秒）
  permissionTTL: 1800  # 30分钟

# 动作配置
action:
  # 脚本执行超时时间（秒）
  scriptTimeout: 300  # 5分钟

# 限流配置
rateLimit:
  enabled: true
  requestsPerMinute: 100  # 每分钟请求数
  burstSize: 20

# 文件上传配置
upload:
  maxSize: 21474836480  # 20GB（字节）
  allowedTypes:
    - "image/jpeg"
    - "image/png"
    - "image/gif"
    - "application/pdf"
    - "application/msword"
    - "application/vnd.ms-excel"
  uploadPath: "uploads"

# 文件管理配置（云盘）
file:
  uploadDir: "uploads"  # 上传目录
  maxFileSize: 21474836480  # 最大文件大小：20GB（字节）
  allowedExts:  # 允许的文件扩展名（空列表表示允许所有类型）
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".gif"
    - ".pdf"
    - ".doc"
    - ".docx"
    - ".xls"
    - ".xlsx"
    - ".ppt"
    - ".pptx"
    - ".txt"
    - ".zip"
    - ".rar"
    - ".7z"
    - ".mp4"
    - ".avi"
    - ".mkv"
    - ".mp3"
    - ".wav"
    - ".mp4"

# 分片上传配置
multipartUpload:
  chunkSize: 52428800  # 默认分片大小：50MB（字节）
  sessionExpireHours: 24  # 上传会话过期时间（小时）
  cleanupInterval: 3600  # 清理任务执行间隔（秒），默认1小时

# Swagger配置
swagger:
  enabled: true
  title: "Sky-Server API"
  description: "元数据驱动的企业级应用框架"
  version: "1.0.0"
  host: "localhost:9090"
  basePath: "/api/v1"

# 安全配置
security:
  # 密码加密cost（bcrypt）
  passwordCost: 10
  # 允许执行Bash命令的白名单
  allowedBashCommands:
    - "echo"
    - "date"
    - "pwd"
  # Bash执行超时（秒）
  bashTimeout: 30

# 监控配置
monitoring:
  # 是否启用慢查询日志
  slowQueryEnabled: true
  # 慢查询阈值（毫秒）
  slowQueryThreshold: 500

# 存储配置
storage:
    # 默认存储类型: local, aliyunOSS, tencentCOS
    default: "tencentCOS"
    # 本地存储配置
    local:
        basePath: "uploads"
        baseURL: "http://localhost:9090/files"
    # 腾讯云COS配置
    tencentCOS:
        bucketURL: "https://zhibo-1301212747.cos.ap-nanjing.myqcloud.com"
        secretID: "YOUR_TENCENT_SECRET_ID"
        secretKey: "YOUR_TENCENT_SECRET_KEY"
        bucketName: "zhibo-1301212747"
        region: "ap-nanjing"
        cdnDomain: ""


# 腾讯云配置
tencentCloud:
    # 腾讯云 SecretID
    secretID: "YOUR_TENCENT_SECRET_ID"
    # 腾讯云 SecretKey
    secretKey: "YOUR_TENCENT_SECRET_KEY"
    # 区域，如 ap-guangzhou, ap-shanghai, ap-beijing
    region: "ap-shanghai"
    # 回调密钥，用于验证腾讯云回调签名（可选，留空则不验证签名）
    callbackKey: ""
    # 直播配置
    live:
        # 是否启用直播功能
        enabled: true
        # 推流域名（必填）- 请在腾讯云直播控制台配置推流域名后填写
        pushDomain: "push.example.com"
        # 播放域名（可选）- 如果配置了播放域名，可以生成播放地址
        playDomain: "play.example.com"
        # 应用名称（默认为 live）
        appName: "live"
        # 推流密钥（必填）- 在腾讯云直播控制台的推流配置中获取
        streamKey: "d0d87c303d4df45fd648af77ea4a9516"
        # 录制文件存储桶（可选）
        recordBucket: ""
        # 录制文件存储区域（可选）
        recordRegion: ""
        # 回调URL（可选）- 用于接收腾讯云直播回调通知
        callbackURL: ""
