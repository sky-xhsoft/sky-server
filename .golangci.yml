run:
  timeout: 5m
  tests: true

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - typecheck
    - gofmt
    - goimports
  disable:
    - exhaustruct
    - gosec

linters-settings:
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/sky-xhsoft/sky-server

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
    - path: wire/wire_gen\.go
      linters:
        - all
  max-issues-per-linter: 0
  max-same-issues: 0
